name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio httpx pytest-cov

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint with flake8
        run: |
          uv pip install --system flake8
          flake8 app/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Run tests
        run: pytest tests/ -v --tb=short -p no:warnings

      - name: Docker build check
        run: docker build -t nexusai-hub-test . || echo "Docker build skipped"
